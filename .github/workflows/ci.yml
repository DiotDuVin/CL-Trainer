# Intégration continue : à chaque push et pull request, GitHub compile le
# projet sur Ubuntu (gcc ET clang) et lance tous les tests. Une PR dont la CI
# échoue ne doit pas être fusionnée.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y g++ valgrind
      - name: Compilation (avertissements = erreurs)
        run: make CC=${{ matrix.cc }} CFLAGS=-Werror
      - name: Tests
        run: make CC=${{ matrix.cc }} test
      - name: AddressSanitizer
        if: matrix.cc == 'gcc'
        run: make clean && make asan
      - name: Valgrind
        if: matrix.cc == 'gcc'
        run: make clean && make valgrind
